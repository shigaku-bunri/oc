  <text x="630" y="908" text-anchor="middle" font-size="14" font-weight="700" fill="#FBEAE6">正門</text>

  <!-- ============ アイコン（3号館内） ============ -->
  <g fill="#FBEAE6">
    <circle cx="700" cy="270" r="15"/>
    <path d="M694 264 v14 M700 264 v14 M706 264 v14" stroke="#295656" stroke-width="2" stroke-linecap="round"/>
    <circle cx="700" cy="320" r="15"/>
    <path d="M693 314 h14 M700 313 v14 M693 326 h14" stroke="#295656" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="700" cy="370" r="15"/>
    <circle cx="700" cy="370" r="8" fill="none" stroke="#295656" stroke-width="2"/>
    <circle cx="565" cy="380" r="15"/>
    <rect x="559" y="373" width="12" height="15" fill="none" stroke="#295656" stroke-width="2"/>
    <circle cx="565" cy="420" r="15"/>
    <rect x="558" y="414" width="14" height="12" rx="1" fill="none" stroke="#295656" stroke-width="2"/>
  </g>

  <!-- 2号館アイコン（ロッカー） -->
  <circle cx="540" cy="600" r="15" fill="#FBEAE6"/>
  <rect x="533" y="593" width="14" height="14" rx="2" fill="none" stroke="#7E3E17" stroke-width="2"/>

