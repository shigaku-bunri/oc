  <ellipse cx="345" cy="500" rx="26" ry="16" fill="#AFCBDB"/>
  <ellipse cx="705" cy="760" rx="20" ry="13" fill="#AFCBDB"/>
  <ellipse cx="750" cy="775" rx="16" ry="11" fill="#AFCBDB"/>

  <!-- ============ 建物 ============ -->

  <!-- 総合体育館 -->
  <rect x="55" y="700" width="290" height="150" rx="6" fill="#4F7A66" stroke="#2C4A3D" stroke-width="2"/>
  <rect x="55" y="700" width="290" height="20" fill="#3E6354"/>

  <!-- サークル棟I -->
  <rect x="40" y="565" width="290" height="80" rx="6" fill="#8B6E93" stroke="#5D4964" stroke-width="2"/>

  <!-- 図書館 -->
  <rect x="165" y="420" width="215" height="120" rx="6" fill="#C7A465" stroke="#8F6F3C" stroke-width="2"/>

  <!-- 資料館 -->
  <rect x="245" y="540" width="200" height="70" rx="6" fill="#D6B87E" stroke="#8F6F3C" stroke-width="2"/>

  <!-- 2号館 -->
  <rect x="480" y="545" width="120" height="230" rx="6" fill="#C1662F" stroke="#7E3E17" stroke-width="2"/>
  <line x1="516" y1="545" x2="516" y2="775" stroke="#7E3E17" stroke-width="1.5"/>
  <line x1="552" y1="545" x2="552" y2="775" stroke="#7E3E17" stroke-width="1.5"/>

  <!-- 1号館 -->
  <rect x="640" y="610" width="220" height="200" rx="6" fill="#5B7D9A" stroke="#33495D" stroke-width="2"/>

  <!-- 3号館 -->
  <rect x="480" y="230" width="255" height="220" rx="6" fill="#4B8E8E" stroke="#295656" stroke-width="2"/>

