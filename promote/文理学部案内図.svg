    <line x1="880" y1="470" x2="1110" y2="470"/>
    <line x1="880" y1="540" x2="1110" y2="540"/>
    <line x1="880" y1="610" x2="1110" y2="610"/>
    <line x1="880" y1="680" x2="1110" y2="680"/>
  </g>

