  <path d="M170 900 h-90 m0 0 l16 -12 m-16 12 l16 12" stroke="#5F5E5A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="928" text-anchor="middle" font-size="16" font-weight="500" fill="#3A3936">下高井戸駅</text>

  <!-- ============ ラベル（建物名） ============ -->
  <g font-weight="700" text-anchor="middle">
    <g>
      <rect x="55" y="778" width="290" height="34" rx="17" fill="#2C4A3D"/>
      <text x="200" y="800" font-size="19" fill="#EAF1E9">総合体育館</text>
    </g>
    <g>
      <rect x="40" y="600" width="150" height="30" rx="15" fill="#5D4964"/>
      <text x="115" y="620" font-size="17" fill="#F3EAF5">サークル棟Ⅰ</text>
    </g>
    <g>
      <rect x="170" y="460" width="150" height="32" rx="16" fill="#8F6F3C"/>
      <text x="245" y="482" font-size="18" fill="#FBF4E7">図書館</text>
    </g>
    <g>
      <rect x="260" y="580" width="150" height="30" rx="15" fill="#8F6F3C"/>
      <text x="335" y="600" font-size="17" fill="#FBF4E7">資料館</text>
    </g>
    <g>
      <rect x="482" y="640" width="110" height="32" rx="16" fill="#7E3E17"/>
      <text x="537" y="662" font-size="18" fill="#FAE9E0">2号館</text>
    </g>
    <g>
      <rect x="655" y="690" width="150" height="34" rx="17" fill="#33495D"/>
      <text x="730" y="713" font-size="19" fill="#E8EEF3">1号館</text>
    </g>
    <g>
      <rect x="520" y="330" width="150" height="34" rx="17" fill="#295656"/>
      <text x="595" y="353" font-size="19" fill="#E7F1F0">3号館</text>
    </g>
    <g>
      <rect x="400" y="60" width="190" height="30" rx="15" fill="#5D4964"/>
      <text x="495" y="80" font-size="17" fill="#F3EAF5">サークル棟Ⅱ</text>
    </g>
    <g>
      <rect x="632" y="115" width="150" height="34" rx="17" fill="#233642"/>
      <text x="707" y="138" font-size="19" fill="#E7EEF2">4号館</text>
    </g>
    <g>
      <rect x="920" y="500" width="150" height="36" rx="18" fill="#182732"/>
      <text x="995" y="524" font-size="20" fill="#EAF0F4">本館</text>
    </g>
    <g>
      <rect x="1015" y="655" width="150" height="32" rx="16" fill="#33495D"/>
      <text x="1090" y="677" font-size="18" fill="#E8EEF3">7号館</text>
    </g>
  </g>

  <!-- ============ 凡例 ============ -->
  <g font-size="13" fill="#3A3936">
    <rect x="900" y="820" width="270" height="130" rx="8" fill="#FDFBF6" stroke="#D8D2C2" stroke-width="1.5"/>
    <text x="916" y="840" font-weight="700" font-size="14">凡例</text>

    <circle cx="924" cy="858" r="8" fill="#4B8E8E"/>
    <path d="M921 855 v6 M924 855 v6 M927 855 v6" stroke="#FBEAE6" stroke-width="1.5" stroke-linecap="round"/>
    <text x="938" y="862">食堂</text>

    <circle cx="924" cy="880" r="8" fill="#4B8E8E"/>
    <path d="M920 877 h8 M924 876 v8 M920 883 h8" stroke="#FBEAE6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="938" y="884">カフェ</text>

    <circle cx="924" cy="902" r="8" fill="#4B8E8E"/>
    <circle cx="924" cy="902" r="4" fill="none" stroke="#FBEAE6" stroke-width="1.5"/>
    <text x="938" y="906">国際交流</text>

    <circle cx="1020" cy="858" r="8" fill="#295656"/>
    <rect x="1016" y="854" width="8" height="9" fill="none" stroke="#FBEAE6" stroke-width="1.5"/>
    <text x="1034" y="862">銀行・ATM</text>

    <circle cx="1020" cy="880" r="8" fill="#295656"/>
    <rect x="1015" y="876" width="10" height="8" rx="1" fill="none" stroke="#FBEAE6" stroke-width="1.5"/>
    <text x="1034" y="884">売店</text>

    <circle cx="1020" cy="902" r="8" fill="#7E3E17"/>
    <rect x="1015" y="898" width="10" height="9" rx="1" fill="none" stroke="#FBEAE6" stroke-width="1.5"/>
    <text x="1034" y="906">ロッカー</text>
  </g>

  <!-- 方位 -->
  <g transform="translate(1140,60)">
    <circle cx="0" cy="0" r="26" fill="#FDFBF6" stroke="#D8D2C2" stroke-width="1.5"/>
    <path d="M0 -18 L6 0 L0 6 L-6 0 Z" fill="#3A3936"/>
    <text x="0" y="-24" text-anchor="middle" font-size="12" font-weight="700" fill="#3A3936">N</text>
  </g>

</svg>
