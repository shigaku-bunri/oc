  <rect x="405" y="90" width="185" height="90" rx="6" fill="#8B6E93" stroke="#5D4964" stroke-width="2"/>

  <!-- 4号館 -->
  <rect x="595" y="60" width="235" height="130" rx="6" fill="#3F5D6E" stroke="#233642" stroke-width="2"/>

  <!-- 本館 -->
  <rect x="880" y="330" width="230" height="460" rx="6" fill="#2F4858" stroke="#182732" stroke-width="2"/>
  <g stroke="#4C6779" stroke-width="1.5">
