<svg viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Yu Gothic',sans-serif">

  <rect x="0" y="0" width="1200" height="980" fill="#F6F2EA"/>

  <!-- ============ 緑地・植栽（背面）============ -->
  <g fill="#8FAE86">
    <circle cx="90" cy="180" r="60"/>
    <circle cx="150" cy="140" r="46"/>
    <circle cx="1000" cy="90" r="50"/>
    <circle cx="1070" cy="150" r="70"/>
    <circle cx="1130" cy="260" r="60"/>
    <circle cx="1150" cy="420" r="55"/>
    <circle cx="1140" cy="600" r="50"/>
    <circle cx="1100" cy="850" r="60"/>
    <circle cx="950" cy="900" r="45"/>
    <circle cx="60" cy="380" r="40"/>
    <circle cx="330" cy="360" r="30"/>
    <circle cx="900" cy="200" r="26"/>
  </g>
  <g fill="#A5C299">
    <circle cx="95" cy="175" r="34"/>
    <circle cx="1005" cy="95" r="30"/>
    <circle cx="1075" cy="145" r="42"/>
    <circle cx="1135" cy="255" r="36"/>
    <circle cx="1145" cy="415" r="32"/>
    <circle cx="1105" cy="845" r="34"/>
  </g>

